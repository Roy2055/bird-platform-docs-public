<svg width="100%" viewBox="0 0 1120 980" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Social media user action flows</title>
  <desc>
    Four operational lanes for social media safety and support: comment or complaint,
    report content, report user, and block user. Red nodes are enforcement actions.
    Teal nodes are resolution states.
  </desc>

  <defs>
    <style>
      .bg { fill: #0f1115; }
      .panel { fill: #161a20; stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .title { fill: #f3f5f7; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 28px; font-weight: 700; text-anchor: middle; }
      .subtitle { fill: #b6bec8; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 400; text-anchor: middle; }
      .laneTitle { fill: #f3f5f7; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 700; text-anchor: middle; }
      .laneNote { fill: #b6bec8; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 400; text-anchor: middle; }
      .nodeTitle { fill: #f7fafc; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .nodeBody { fill: rgba(255,255,255,0.84); font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 11px; font-weight: 400; text-anchor: middle; dominant-baseline: central; }
      .legendText { fill: #c6ccd4; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; }
      .footer { fill: #aab3bd; font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .line { stroke: #8e97a3; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .linkNode { cursor: pointer; }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8e97a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="980"/>

  <rect class="panel" x="40" y="28" width="1040" height="924" rx="20"/>

  <text class="title" x="560" y="62">Social Media User Actions Overview</text>
  <text class="subtitle" x="560" y="88">Four distinct operational lanes for support, moderation, trust &amp; safety, and self-serve user protection</text>

  <g class="linkNode">
    <rect x="430" y="112" width="260" height="48" rx="10" fill="#353b45" stroke="#697281" stroke-width="1"/>
    <text class="nodeTitle" x="560" y="137">User action triggered</text>
  </g>

  <line class="line" x1="560" y1="160" x2="560" y2="192"/>
  <line x1="160" y1="192" x2="960" y2="192" stroke="#8e97a3" stroke-width="1.2"/>
  <line x1="160" y1="192" x2="160" y2="212" stroke="#8e97a3" stroke-width="1.2"/>
  <line x1="426" y1="192" x2="426" y2="212" stroke="#8e97a3" stroke-width="1.2"/>
  <line x1="694" y1="192" x2="694" y2="212" stroke="#8e97a3" stroke-width="1.2"/>
  <line x1="960" y1="192" x2="960" y2="212" stroke="#8e97a3" stroke-width="1.2"/>

  <text class="laneTitle" x="160" y="234">Comment / complaint</text>
  <text class="laneNote" x="160" y="252">Support conversation lane</text>

  <text class="laneTitle" x="426" y="234">Report content</text>
  <text class="laneNote" x="426" y="252">Content moderation lane</text>

  <text class="laneTitle" x="694" y="234">Report user</text>
  <text class="laneNote" x="694" y="252">Trust &amp; safety lane</text>

  <text class="laneTitle" x="960" y="234">Block user</text>
  <text class="laneNote" x="960" y="252">Immediate self-serve lane</text>

  <g class="linkNode">
    <rect x="100" y="278" width="120" height="56" rx="10" fill="#124b8b" stroke="#8cc0ff" stroke-width="1"/>
    <text class="nodeTitle" x="160" y="300">Support ticket</text>
    <text class="nodeBody" x="160" y="320">Created</text>
  </g>
  <line class="line" x1="160" y1="334" x2="160" y2="364"/>

  <g class="linkNode">
    <rect x="100" y="364" width="120" height="64" rx="10" fill="#124b8b" stroke="#8cc0ff" stroke-width="1"/>
    <text class="nodeTitle" x="160" y="388">Sentiment</text>
    <text class="nodeBody" x="160" y="408">analysis and</text>
    <text class="nodeBody" x="160" y="422">prioritisation</text>
  </g>
  <line class="line" x1="160" y1="428" x2="160" y2="458"/>

  <g class="linkNode">
    <rect x="100" y="458" width="120" height="64" rx="10" fill="#124b8b" stroke="#8cc0ff" stroke-width="1"/>
    <text class="nodeTitle" x="160" y="482">Human agent</text>
    <text class="nodeBody" x="160" y="502">Responds to</text>
    <text class="nodeBody" x="160" y="516">the user</text>
  </g>
  <line class="line" x1="160" y1="522" x2="160" y2="552"/>

  <g class="linkNode">
    <rect x="100" y="552" width="120" height="64" rx="10" fill="#124b8b" stroke="#8cc0ff" stroke-width="1"/>
    <text class="nodeTitle" x="160" y="576">Two-way</text>
    <text class="nodeBody" x="160" y="596">Conversation</text>
    <text class="nodeBody" x="160" y="610">stays open</text>
  </g>
  <line class="line" x1="160" y1="616" x2="160" y2="646"/>

  <g class="linkNode">
    <rect x="100" y="646" width="120" height="58" rx="10" fill="#0f766e" stroke="#5fe0d1" stroke-width="1"/>
    <text class="nodeTitle" x="160" y="670">Resolved</text>
    <text class="nodeBody" x="160" y="690">User satisfied</text>
  </g>

  <g class="linkNode">
    <rect x="366" y="278" width="120" height="56" rx="10" fill="#8a5308" stroke="#f4bc55" stroke-width="1"/>
    <text class="nodeTitle" x="426" y="300">Moderation</text>
    <text class="nodeBody" x="426" y="320">ticket created</text>
  </g>
  <line class="line" x1="426" y1="334" x2="426" y2="364"/>

  <g class="linkNode">
    <rect x="366" y="364" width="120" height="64" rx="10" fill="#8a5308" stroke="#f4bc55" stroke-width="1"/>
    <text class="nodeTitle" x="426" y="388">Severity</text>
    <text class="nodeBody" x="426" y="408">Auto-classified</text>
    <text class="nodeBody" x="426" y="422">first</text>
  </g>
  <line class="line" x1="426" y1="428" x2="426" y2="458"/>

  <g class="linkNode">
    <rect x="366" y="458" width="120" height="64" rx="10" fill="#8a5308" stroke="#f4bc55" stroke-width="1"/>
    <text class="nodeTitle" x="426" y="482">Human mod</text>
    <text class="nodeBody" x="426" y="502">Reviews and</text>
    <text class="nodeBody" x="426" y="516">decides</text>
  </g>
  <line class="line" x1="426" y1="522" x2="426" y2="548"/>
  <line class="line" x1="426" y1="548" x2="374" y2="584"/>
  <line class="line" x1="426" y1="548" x2="478" y2="584"/>

  <g class="linkNode">
    <rect x="314" y="584" width="120" height="58" rx="10" fill="#b91c1c" stroke="#ff8f8f" stroke-width="1"/>
    <text class="nodeTitle" x="374" y="608">Action</text>
    <text class="nodeBody" x="374" y="628">Taken</text>
  </g>

  <g class="linkNode">
    <rect x="418" y="584" width="120" height="58" rx="10" fill="#b91c1c" stroke="#ff8f8f" stroke-width="1"/>
    <text class="nodeTitle" x="478" y="608">No action</text>
    <text class="nodeBody" x="478" y="628">Taken</text>
  </g>

  <line class="line" x1="374" y1="642" x2="374" y2="676"/>
  <line class="line" x1="478" y1="642" x2="478" y2="676"/>
  <line x1="374" y1="676" x2="478" y2="676" stroke="#8e97a3" stroke-width="1.2"/>
  <line class="line" x1="426" y1="676" x2="426" y2="708"/>

  <g class="linkNode">
    <rect x="366" y="708" width="120" height="72" rx="10" fill="#0f766e" stroke="#5fe0d1" stroke-width="1"/>
    <text class="nodeTitle" x="426" y="732">Notify both</text>
    <text class="nodeBody" x="426" y="752">Reporter and</text>
    <text class="nodeBody" x="426" y="766">content author</text>
  </g>

  <g class="linkNode">
    <rect x="634" y="278" width="120" height="56" rx="10" fill="#b45309" stroke="#ff9d6b" stroke-width="1"/>
    <text class="nodeTitle" x="694" y="300">Trust &amp; safety</text>
    <text class="nodeBody" x="694" y="320">case created</text>
  </g>
  <line class="line" x1="694" y1="334" x2="694" y2="364"/>

  <g class="linkNode">
    <rect x="634" y="364" width="120" height="78" rx="10" fill="#b45309" stroke="#ff9d6b" stroke-width="1"/>
    <text class="nodeTitle" x="694" y="388">History and</text>
    <text class="nodeBody" x="694" y="408">behavioural</text>
    <text class="nodeBody" x="694" y="422">signals reviewed</text>
  </g>
  <line class="line" x1="694" y1="442" x2="694" y2="472"/>

  <g class="linkNode">
    <rect x="634" y="472" width="120" height="64" rx="10" fill="#b45309" stroke="#ff9d6b" stroke-width="1"/>
    <text class="nodeTitle" x="694" y="496">Human trust</text>
    <text class="nodeBody" x="694" y="516">&amp; safety review</text>
  </g>

  <line class="line" x1="694" y1="536" x2="694" y2="562"/>
  <line class="line" x1="694" y1="562" x2="630" y2="602"/>
  <line class="line" x1="694" y1="562" x2="694" y2="602"/>
  <line class="line" x1="694" y1="562" x2="758" y2="602"/>

  <g class="linkNode">
    <rect x="570" y="602" width="120" height="58" rx="10" fill="#b91c1c" stroke="#ff8f8f" stroke-width="1"/>
    <text class="nodeTitle" x="630" y="626">Warn</text>
    <text class="nodeBody" x="630" y="646">Account notified</text>
  </g>

  <g class="linkNode">
    <rect x="634" y="602" width="120" height="58" rx="10" fill="#b91c1c" stroke="#ff8f8f" stroke-width="1"/>
    <text class="nodeTitle" x="694" y="620">Temporary</text>
    <text class="nodeBody" x="694" y="640">Suspend</text>
  </g>

  <g class="linkNode">
    <rect x="698" y="602" width="120" height="58" rx="10" fill="#b91c1c" stroke="#ff8f8f" stroke-width="1"/>
    <text class="nodeTitle" x="758" y="620">Permanent</text>
    <text class="nodeBody" x="758" y="640">Ban</text>
  </g>

  <line class="line" x1="630" y1="660" x2="630" y2="702"/>
  <line class="line" x1="694" y1="660" x2="694" y2="702"/>
  <line class="line" x1="758" y1="660" x2="758" y2="702"/>
  <line x1="630" y1="702" x2="758" y2="702" stroke="#8e97a3" stroke-width="1.2"/>
  <line class="line" x1="694" y1="702" x2="694" y2="734"/>

  <g class="linkNode">
    <rect x="634" y="734" width="120" height="58" rx="10" fill="#0f766e" stroke="#5fe0d1" stroke-width="1"/>
    <text class="nodeTitle" x="694" y="758">Resolved</text>
    <text class="nodeBody" x="694" y="778">Case closed</text>
  </g>

  <g class="linkNode">
    <rect x="900" y="278" width="120" height="58" rx="10" fill="#5b3cc4" stroke="#c3b2ff" stroke-width="1"/>
    <text class="nodeTitle" x="960" y="300">Immediate</text>
    <text class="nodeBody" x="960" y="320">Self-serve block</text>
  </g>
  <line class="line" x1="960" y1="336" x2="960" y2="366"/>

  <g class="linkNode">
    <rect x="900" y="366" width="120" height="64" rx="10" fill="#5b3cc4" stroke="#c3b2ff" stroke-width="1"/>
    <text class="nodeTitle" x="960" y="390">No review</text>
    <text class="nodeBody" x="960" y="410">queue and no</text>
    <text class="nodeBody" x="960" y="424">human in loop</text>
  </g>
  <line class="line" x1="960" y1="430" x2="960" y2="460"/>

  <g class="linkNode">
    <rect x="900" y="460" width="120" height="72" rx="10" fill="#5b3cc4" stroke="#c3b2ff" stroke-width="1"/>
    <text class="nodeTitle" x="960" y="484">Signal logged</text>
    <text class="nodeBody" x="960" y="504">Fed back into</text>
    <text class="nodeBody" x="960" y="518">safety models</text>
  </g>
  <line class="line" x1="960" y1="532" x2="960" y2="562"/>

  <g class="linkNode">
    <rect x="900" y="562" width="120" height="58" rx="10" fill="#0f766e" stroke="#5fe0d1" stroke-width="1"/>
    <text class="nodeTitle" x="960" y="586">Resolved</text>
    <text class="nodeBody" x="960" y="606">Block active</text>
  </g>

  <rect x="74" y="846" width="972" height="78" rx="14" fill="#1a1f27" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <rect x="102" y="872" width="16" height="16" rx="4" fill="#124b8b" stroke="#8cc0ff" stroke-width="1"/>
  <text class="legendText" x="128" y="884">Comment / complaint</text>

  <rect x="304" y="872" width="16" height="16" rx="4" fill="#8a5308" stroke="#f4bc55" stroke-width="1"/>
  <text class="legendText" x="330" y="884">Report content</text>

  <rect x="468" y="872" width="16" height="16" rx="4" fill="#b45309" stroke="#ff9d6b" stroke-width="1"/>
  <text class="legendText" x="494" y="884">Report user</text>

  <rect x="608" y="872" width="16" height="16" rx="4" fill="#5b3cc4" stroke="#c3b2ff" stroke-width="1"/>
  <text class="legendText" x="634" y="884">Block user</text>

  <rect x="740" y="872" width="16" height="16" rx="4" fill="#b91c1c" stroke="#ff8f8f" stroke-width="1"/>
  <text class="legendText" x="766" y="884">Enforcement action</text>

  <rect x="906" y="872" width="16" height="16" rx="4" fill="#0f766e" stroke="#5fe0d1" stroke-width="1"/>
  <text class="legendText" x="932" y="884">Resolution state</text>

  <text class="footer" x="560" y="940">Open the SVG directly to inspect the full visual workflow.</text>
</svg>
